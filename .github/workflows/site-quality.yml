name: Site quality
on:
  push:
    branches: [codex/editorial-redesign]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test localized routes
        run: |
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ro > /dev/null && break; sleep 1; done
          for route in ro en ro/program en/program ro/concurs ro/participare ro/bucovina; do
            curl --fail --silent "http://127.0.0.1:4321/$route" > /dev/null || exit 1
          done
